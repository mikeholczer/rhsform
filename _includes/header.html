<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="" width="48" height="48">
      <span class="brand__name">{{ site.title }}</span>
    </a>

    <input class="nav-toggle" type="checkbox" id="nav-toggle">
    <label class="nav-toggle-label" for="nav-toggle">☰ <span>Menu</span></label>

    <nav class="site-nav" aria-label="Main">
      <ul>
        {%- for item in site.data.navigation %}
        <li>
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
