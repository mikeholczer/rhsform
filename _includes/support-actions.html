<ol class="support-list">
{%- for action in site.data.support_actions %}
  <li class="support-item">
    <span class="support-item__step" aria-hidden="true">{{ action.number }}</span>
    <h3 class="support-item__title">{{ action.title }}</h3>
    <p>{{ action.body }}</p>
    {%- if action.link_url %}
    <a class="button" href="{{ action.link_url | relative_url }}">{{ action.link_text }}</a>
    {%- endif %}
  </li>
{%- endfor %}
</ol>
