---
layout: default
---
<article class="page">
  <header class="page-header">
    <p class="page-header__kicker">{{ page.kicker | default: site.title }}</p>
    <h1>{{ page.title }}</h1>
    {%- if page.lede %}
    <p class="lede">{{ page.lede }}</p>
    {%- endif %}
  </header>
  <div id="main-content" class="page-layout" tabindex="-1">
    {%- include rail.html html=content %}
    <div class="page-body">
{{ content }}
    </div>
  </div>
</article>
