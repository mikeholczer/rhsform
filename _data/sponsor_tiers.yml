# Corporate sponsorship tiers, in display order.
# Each benefit has a key (used to look up the tier's property) and a label
# (shown down the left side of the comparison grid). Each tier object has a
# `properties` map keyed by benefit key; a value of `true` means the tier
# includes the benefit, while a short string (e.g. a logo size) is shown when
# the benefit has a tier-specific variation.
benefits:
  - key: website_link
    label: Logo or ad with hyperlink on FORM website
  - key: program_ad
    label: Logo or ad in printed programs
  - key: logo_hallway_banner
    label: Logo on hallway banner at concerts
  - key: logo_instrument_truck
    label: Logo on instrument truck banner
  - key: email_blasts
    label: Acknowledgment in FORM email blasts
  - key: table_hallway_concerts
    label: Table in hallway at concerts & performances
  - key: announcement_marching_band
    label: Announcement at home football games

tiers:
  - name: Platinum Sponsor
    slug: platinum
    price: "$1,200"
    image: /assets/images/sponsorship-platinum.png
    image_alt: Platinum sponsorship
    properties:
      announcement_marching_band: true
      table_hallway_concerts: true
      email_blasts: true
      logo_instrument_truck: "large"
      logo_hallway_banner: "large"
      program_ad: "1/2 page"
      website_link: true

  - name: Gold Sponsor
    slug: gold
    price: "$700"
    image: /assets/images/sponsorship-gold.png
    image_alt: Gold sponsorship
    properties:
      announcement_marching_band: false
      table_hallway_concerts: false
      email_blasts: true
      logo_instrument_truck: "large"
      logo_hallway_banner: "large"
      program_ad: "1/2 page"
      website_link: true

  - name: Silver Sponsor
    slug: silver
    price: "$350"
    image: /assets/images/sponsorship-silver.png
    image_alt: Silver sponsorship
    properties:
      announcement_marching_band: false
      table_hallway_concerts: false
      email_blasts: false
      logo_instrument_truck: "medium"
      logo_hallway_banner: "medium"
      program_ad: "1/4 page"
      website_link: true
